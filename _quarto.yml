project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
  resources:
    - rpg/

website:
  title: "Michèle Renard"
  site-url: https://michelerenard.github.io
  description: >
    Environmental physiologist and quantitative researcher at the National
    University of Singapore, working on heat, sleep and population health.
  favicon: images/favicon.png
  image: images/og-image.png
  navbar:
    background: light
    logo: ""
    title: "Michèle Renard"
    left:
      - href: index.qmd
        text: About
      - href: research.qmd
        text: Research
      - href: publications.qmd
        text: Publications
      - href: tools.qmd
        text: Resources
      - href: collaborate.qmd
        text: Collaborate
      - href: cv.qmd
        text: CV
    # Contact stays in the header; LinkedIn and GitHub live in the footer.
    right:
      - icon: envelope
        href: mailto:mrenard@nus.edu.sg
        aria-label: Email
  page-footer:
    border: true
    left: |
      © 2026 Michèle Renard · [ORCID 0000-0003-4517-1316](https://orcid.org/0000-0003-4517-1316) · [LinkedIn](https://www.linkedin.com/in/michelerenard/) · [GitHub](https://github.com/MicheleRenard)
    right: |
      Built with [Quarto](https://quarto.org) · [Site source](https://github.com/MicheleRenard/michelerenard.github.io) · [▶ Press Start](rpg/){.press-start}
  open-graph: true
  twitter-card: false

format:
  html:
    theme:
      light: [cosmo, theme-light.scss, theme-rules.scss]
      dark:  [cosmo, theme-dark.scss, theme-rules.scss]
    toc: true
    toc-depth: 3
    toc-title: "On this page"
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true
    grid:
      sidebar-width: 240px
      body-width: 900px
      margin-width: 240px

execute:
  freeze: auto
